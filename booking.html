<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking | Last - Click</title>
  <link rel="stylesheet" href="booking.css" />
</head>

<body>

  <header class="main-header">
    <h1>Last - Click</h1>
    <button class="menu-toggle" type="button" aria-label="Toggle Navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <nav class="mobile-nav" aria-label="Main navigation">
    <a href="Home.html">Home</a>
    <a href="Portfolio.html">Portfolio</a>
    <a href="booking.html" aria-current="page">Booking</a>
    <a href="contact.html">Contact</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <h2>Book a Session</h2>
      <p>Portrait, wedding, and commercial photography.</p>
    </div>
  </section>

  <!-- Booking Form -->
  <section class="form-section">
    <p class="label">YOUR DETAILS</p>
    <div class="card">

      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. Lekh Dim" />
      </div>

      <div class="field">
        <label>Service Type</label>
        <select>
          <option value="" disabled selected>Click Me</option>
          <option>Portrait Session</option>
          <option>Wedding Photography</option>
          <option>Commercial Shoot</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label>Date</label>
          <input type="date" />
        </div>
        <div class="field">
          <label>Time</label>
          <select>
            <option value="" disabled selected>Select</option>
            <option>8:00 AM</option>
            <option>10:00 AM</option>
            <option>12:00 PM</option>
            <option>2:00 PM</option>
            <option>4:00 PM</option>
          </select>
        </div>
      </div>

      <button class="btn-primary">Confirm Booking</button>

    </div>
  </section>

  <!-- Services -->
  <section class="services-section">
    <p class="label">SERVICES</p>
    <div class="services-row">

      <div class="service-card"
        style="background-image: url('https://images.unsplash.com/photo-1766763845239-0194f176b0a8?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fG5lcGFsaSUyMHdlZWRpbmd8ZW58MHx8MHx8fDA%3D')">
        <div class="service-info">
          <p class="service-name">Wedding</p>
          <p class="service-sub">For couples</p>
        </div>
      </div>

      <div class="service-card"
        style="background-image: url('https://images.unsplash.com/photo-1777993325982-d0e9e0f61cfb?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNHx8fGVufDB8fHx8fA%3D%3D')">
        <div class="service-info">
          <p class="service-name">Portrait</p>
          <p class="service-sub">For families</p>
        </div>
      </div>

      <div class="service-card"
        style="background-image: url('https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGNvbW1lcmNpYWx8ZW58MHx8MHx8fDA%3D')">
        <div class="service-info">
          <p class="service-name">Commercial</p>
          <p class="service-sub">For brands</p>
        </div>
      </div>

    </div>
  </section>

  <footer>
    <nav class="Nav-Bar">
      <a href="Home.html" class="Home">
        <img src="./Images/home.svg" width="24" height="24" alt="Home">
        <p>Home</p>
      </a>
      <a href="Portfolio.html" class="Portfolio">
        <img src="./Images/portfolio.svg" width="24" height="24" alt="Portfolio">
        <p>Portfolio</p>
      </a>
      <a href="booking.html" class="Booking active" aria-current="page">
        <img src="./Images/book.svg" width="24" height="24" alt="Booking">
        <p>Booking</p>
      </a>
      <a href="contact.html" class="Contact">
        <img src="./Images/contact.svg" width="24" height="24" alt="Contact">
        <p>Contact</p>
      </a>
    </nav>
  </footer>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.classList.toggle('active');
      mobileNav.classList.toggle('active', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });
  </script>

</body>

</html>
