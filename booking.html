<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book a Session</title>
  <link rel="stylesheet" href="booking.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <h1>LAST CLICK</h1>
      <p>STUDIO · BIRTAMOD</p>
    </div>
    <a href="contact.html" class="btn-outline">Contact</a>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <h2>Book a Session</h2>
      <p>Portrait, wedding, and commercial photography.</p>
    </div>
  </section>

  <!-- Booking Form -->
  <section class="form-section">
    <p class="label">YOUR DETAILS</p>
    <div class="card">

      <div class="field">
        <label>Full Name</label>
        <input type="text" placeholder="e.g. Lekh Dim" />
      </div>

      <div class="field">
        <label>Service Type</label>
        <select>
          <option value="" disabled selected>Click Me</option>
          <option>Portrait Session</option>
          <option>Wedding Photography</option>
          <option>Commercial Shoot</option>
        </select>
      </div>

      <div class="row">
        <div class="field">
          <label>Date</label>
          <input type="date" />
        </div>
        <div class="field">
          <label>Time</label>
          <select>
            <option value="" disabled selected>Select</option>
            <option>8:00 AM</option>
            <option>10:00 AM</option>
            <option>12:00 PM</option>
            <option>2:00 PM</option>
            <option>4:00 PM</option>
          </select>
        </div>
      </div>

      <button class="btn-primary">Confirm Booking</button>

    </div>
  </section>

  <!-- Services -->
  <section class="services-section">
    <p class="label">SERVICES</p>
    <div class="services-row">

      <div class="service-card" style="background-image: url('https://images.unsplash.com/photo-1766763845239-0194f176b0a8?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTl8fG5lcGFsaSUyMHdlZWRpbmd8ZW58MHx8MHx8fDA%3D')">
        <div class="service-info">
          <p class="service-name">Wedding</p>
          <p class="service-sub">For couples</p>
        </div>
      </div>

      <div class="service-card" style="background-image: url('https://images.unsplash.com/photo-1777993325982-d0e9e0f61cfb?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNHx8fGVufDB8fHx8fA%3D%3D')">
        <div class="service-info">
          <p class="service-name">Portrait</p>
          <p class="service-sub">For families</p>
        </div>
      </div>

      <div class="service-card" style="background-image: url('https://images.unsplash.com/photo-1560179707-f14e90ef3623?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8MTJ8fGNvbW1lcmNpYWx8ZW58MHx8MHx8fDA%3D')">
        <div class="service-info">
          <p class="service-name">Commercial</p>
          <p class="service-sub">For brands</p>
        </div>
      </div>

    </div>
  </section>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html">🏠 <span>Home</span></a>
    <a href="#">🖼 <span>Gallery</span></a>
    <a href="booking.html" class="active">📅 <span>Book</span></a>
    <a href="#">📖 <span>Journal</span></a>
    <a href="contact.html">🏷 <span>Contact</span></a>
  </nav>

</body>
</html>
