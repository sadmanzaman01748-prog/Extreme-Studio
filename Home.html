<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lenscraft</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="main-header">
        <h1>Lenscraft</h1>
        

        <button class="menu-toggle" aria-label="Toggle Navigation">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </button>
    </header>


    <nav class="mobile-nav">
        <a href="Home.html">Home</a>
        <a href="Portfolio.html">Portfolio</a>
        <a href="booking.html">Booking</a>
        <a href="contact.html">Contact</a>
    </nav>


    <main class="content-area">
        <input type="text" placeholder="Type or search anything">

    </main>


    <footer>
        <nav class="Nav-Bar">
            <a href="Home.html" class="Home">
                <img src="./Images/home.svg" width="24" height="24" alt="Home">
                <p>Home</p>
            </a>
            <a href="Portfolio.html" class="Portfolio">
                <img src="./Images/portfolio.svg" width="24" height="24" alt="Portfolio">
                <p>Portfolio</p>
            </a>
            <a href="booking.html" class="Booking">
                <img src="./Images/book.svg" width="24" height="24" alt="Booking">
                <p>Booking</p>
            </a>
            <a href="contact.html" class="Contact">
                <img src="./Images/contact.svg" width="24" height="24" alt="Contact">
                <p>Contact</p>
            </a>
        </nav>
    </footer>

    <!-- JAVASCRIPT: Makes the hamburger button click open the slide-out menu -->
    <script>
        const menuToggle = document.querySelector('.menu-toggle');
        const mobileNav = document.querySelector('.mobile-nav');

        menuToggle.addEventListener('click', () => {
            menuToggle.classList.toggle('active');
            mobileNav.classList.toggle('active');
        });
    </script>
</body>
</html>
