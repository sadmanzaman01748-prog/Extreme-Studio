<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <div class="logo">
      <h1>LAST CLICK</h1>
      <p>STUDIO · BIRTAMOD</p>
    </div>
    <a href="booking.html" class="btn-outline">Book</a>
  </header>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <h2>Let's Talk</h2>
      <p>Questions about pricing or your vision — we're here.</p>
    </div>
  </section>

  <!-- Contact Info -->
  <section class="info-section">
    <p class="label">REACH US</p>
    <div class="info-row">

      <div class="info-card">
        <p class="icon">✉️</p>
        <p class="info-title">Email</p>
        <p class="info-val">hello@lastclick.co.npl</p>
      </div>

      <div class="info-card">
        <p class="icon">📱</p>
        <p class="info-title">Phone</p>
        <p class="info-val">+977 1 234 567861</p>
      </div>

      <div class="info-card">
        <p class="icon">📍</p>
        <p class="info-title">Studio</p>
        <p class="info-val">Birtamod, NPL</p>
      </div>

    </div>
  </section>

  <!-- Message Form -->
  <section class="form-section">
    <p class="label">SEND A MESSAGE</p>
    <div class="card">

      <div class="row">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Your name" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@email.com" />
        </div>
      </div>

      <div class="field">
        <label>Subject</label>
        <select>
          <option value="" disabled selected>What is this about?</option>
          <option>Pricing  Packages</option>
          <option>Booking Question</option>
          <option>Wedding Enquiry</option>
          <option>Commercial Work</option>
          <option>Cancel Booking</option>
          <option>Something Else</option>
        </select>
      </div>

      <div class="field">
        <label>Message</label>
        <textarea rows="4" placeholder="Tell us about your project..."></textarea>
      </div>

      <button class="btn-primary">Send Message</button>

    </div>
  </section>

  <!-- Bottom Nav -->
  <nav class="bottom-nav">
    <a href="index.html">🏠 <span>Home</span></a>
    <a href="#">🖼 <span>Gallery</span></a>
    <a href="booking.html">📅 <span>Book</span></a>
    <a href="#">📖 <span>Journal</span></a>
    <a href="contact.html" class="active">🏷 <span>Contact</span></a>
  </nav>

</body>
</html>
