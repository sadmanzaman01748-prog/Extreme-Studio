<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact | Last - Click</title>
  <link rel="stylesheet" href="contact.css" />
</head>
<body>

  <header class="main-header">
    <h1>Last - Click</h1>
    <button class="menu-toggle" type="button" aria-label="Toggle Navigation" aria-expanded="false">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>
  </header>

  <nav class="mobile-nav" aria-label="Main navigation">
    <a href="Home.html">Home</a>
    <a href="Portfolio.html">Portfolio</a>
    <a href="booking.html">Booking</a>
    <a href="contact.html" aria-current="page">Contact</a>
  </nav>

  <!-- Hero -->
  <section class="hero">
    <div class="hero-text">
      <h2>Let's Talk</h2>
      <p>Questions about pricing or your vision — we're here.</p>
    </div>
  </section>

  <!-- Contact Info -->
  <section class="info-section">
    <p class="label">REACH US</p>
    <div class="info-row">

      <div class="info-card">
        <p class="icon">✉️</p>
        <p class="info-title">Email</p>
        <p class="info-val">hello@lastclick.co.npl</p>
      </div>

      <div class="info-card">
        <p class="icon">📱</p>
        <p class="info-title">Phone</p>
        <p class="info-val">+977 1 234 567861</p>
      </div>

      <div class="info-card">
        <p class="icon">📍</p>
        <p class="info-title">Studio</p>
        <p class="info-val">Birtamod, NPL</p>
      </div>

    </div>
  </section>

  <!-- Message Form -->
  <section class="form-section">
    <p class="label">SEND A MESSAGE</p>
    <div class="card">

      <div class="row">
        <div class="field">
          <label>Name</label>
          <input type="text" placeholder="Your name" />
        </div>
        <div class="field">
          <label>Email</label>
          <input type="email" placeholder="you@email.com" />
        </div>
      </div>

      <div class="field">
        <label>Subject</label>
        <select>
          <option value="" disabled selected>What is this about?</option>
          <option>Pricing  Packages</option>
          <option>Booking Question</option>
          <option>Wedding Enquiry</option>
          <option>Commercial Work</option>
          <option>Cancel Booking</option>
          <option>Something Else</option>
        </select>
      </div>

      <div class="field">
        <label>Message</label>
        <textarea rows="4" placeholder="Tell us about your project..."></textarea>
      </div>

      <button class="btn-primary">Send Message</button>

    </div>
  </section>

  <footer>
    <nav class="Nav-Bar">
      <a href="Home.html" class="Home">
        <img src="./Images/home.svg" width="24" height="24" alt="Home">
        <p>Home</p>
      </a>
      <a href="Portfolio.html" class="Portfolio">
        <img src="./Images/portfolio.svg" width="24" height="24" alt="Portfolio">
        <p>Portfolio</p>
      </a>
      <a href="booking.html" class="Booking">
        <img src="./Images/book.svg" width="24" height="24" alt="Booking">
        <p>Booking</p>
      </a>
      <a href="contact.html" class="Contact active" aria-current="page">
        <img src="./Images/contact.svg" width="24" height="24" alt="Contact">
        <p>Contact</p>
      </a>
    </nav>
  </footer>

  <script>
    const menuToggle = document.querySelector('.menu-toggle');
    const mobileNav = document.querySelector('.mobile-nav');

    menuToggle.addEventListener('click', () => {
      const isOpen = menuToggle.classList.toggle('active');
      mobileNav.classList.toggle('active', isOpen);
      menuToggle.setAttribute('aria-expanded', String(isOpen));
    });
  </script>

</body>
</html>
